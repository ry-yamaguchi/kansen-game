# main へ push されるたびにビルドし、GitHub Pages へ公開する。
#
# 【承知のうえの失敗】画面の入口 src/main.tsx がまだ無いため、当面 vite build は
# "Failed to resolve /src/main.tsx" で落ちる。これは想定どおりである。
# UI が入った時点で自動的に成功し、公開される。**直すためにこのファイルを書き換えないこと。**
name: Pages

on:
  push:
    branches: [main]
    # 文書だけの変更では公開し直さない（要望・意見の追記で毎回走らせないため）
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kiro/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1度に1つでよい。走行中のものは打ち切って最新だけ出す
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
